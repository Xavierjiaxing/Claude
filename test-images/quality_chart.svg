<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500">
  <rect width="800" height="500" fill="white"/>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">注塑工序合格率统计 (2026年1-5月)</text>
  
  <!-- Bars and labels for Version 1 data -->
  <text x="100" y="440" text-anchor="middle" font-size="14" fill="#666">1月</text>
  <rect x="60" y="150" width="80" height="280" fill="#4CAF50"/><text x="100" y="140" text-anchor="middle" font-size="16" fill="#333">93.2%</text>
  
  <text x="220" y="440" text-anchor="middle" font-size="14" fill="#666">2月</text>
  <rect x="180" y="130" width="80" height="300" fill="#4CAF50"/><text x="220" y="120" text-anchor="middle" font-size="16" fill="#333">94.1%</text>
  
  <text x="340" y="440" text-anchor="middle" font-size="14" fill="#666">3月</text>
  <rect x="300" y="170" width="80" height="260" fill="#FF9800"/><text x="340" y="160" text-anchor="middle" font-size="16" fill="#333">91.5%</text>
  
  <text x="460" y="440" text-anchor="middle" font-size="14" fill="#666">4月</text>
  <rect x="420" y="100" width="80" height="330" fill="#4CAF50"/><text x="460" y="90" text-anchor="middle" font-size="16" fill="#333">95.8%</text>
  
  <text x="580" y="440" text-anchor="middle" font-size="14" fill="#666">5月</text>
  <rect x="540" y="80" width="80" height="350" fill="#2196F3"/><text x="580" y="70" text-anchor="middle" font-size="16" fill="#333">96.3%</text>
  
  <text x="700" y="440" text-anchor="middle" font-size="14" fill="#666">目标</text>
  <rect x="660" y="120" width="80" height="310" fill="#9C27B0"/><text x="700" y="110" text-anchor="middle" font-size="16" fill="#333">95.0%</text>
  
  <!-- Y-axis -->
  <line x1="40" y1="50" x2="40" y2="430" stroke="#999" stroke-width="1"/>
  <text x="30" y="430" text-anchor="end" font-size="12" fill="#999">0%</text>
  <text x="30" y="335" text-anchor="end" font-size="12" fill="#999">25%</text>
  <text x="30" y="240" text-anchor="end" font-size="12" fill="#999">50%</text>
  <text x="30" y="145" text-anchor="end" font-size="12" fill="#999">75%</text>
  <text x="30" y="55" text-anchor="end" font-size="12" fill="#999">100%</text>
  
  <!-- Legend -->
  <rect x="60" y="470" width="12" height="12" fill="#4CAF50"/><text x="78" y="481" font-size="12" fill="#666">达标</text>
  <rect x="130" y="470" width="12" height="12" fill="#FF9800"/><text x="148" y="481" font-size="12" fill="#666">预警</text>
  <rect x="200" y="470" width="12" height="12" fill="#9C27B0"/><text x="218" y="481" font-size="12" fill="#666">目标值</text>
  
  <!-- Footer -->
  <text x="400" y="498" text-anchor="middle" font-size="10" fill="#aaa">数据来源：生产部 2026-05 月报  |  标准：ISO 13485:2016</text>
</svg>
