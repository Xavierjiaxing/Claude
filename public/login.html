<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 医疗器械 AI 知识库</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Fira Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #022b71, #0c2873, #4a1d8a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 36px;
      width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      text-align: center;
    }
    .login-card h1 {
      font-size: 22px;
      color: #1a3a4a;
      margin-bottom: 6px;
    }
    .login-card .subtitle {
      font-size: 13px;
      color: #8899a6;
      margin-bottom: 28px;
    }
    .login-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #0c2873;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .login-btn:hover { background: #1557b0; }
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled { background: #a0c4f1; cursor: not-allowed; }
    .error-msg {
      color: #d93025;
      font-size: 13px;
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">&#128274;</div>
    <h1>医疗器械 AI 知识库</h1>
    <p class="subtitle">请输入密码以访问系统</p>
    <div class="input-group">
      <label for="passwordInput">访问密码</label>
      <input type="password" id="passwordInput" placeholder="请输入密码" autofocus>
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    document.getElementById('passwordInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('errorMsg');

      if (!password) {
        errorEl.textContent = '请输入密码';
        return;
      }

      btn.disabled = true;
      btn.textContent = '验证中...';
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          const data = await res.json();
          sessionStorage.setItem('auth_token', data.token);
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || '密码错误';
          btn.disabled = false;
          btn.textContent = '登 录';
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请重试';
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    }
  </script>
</body>
</html>
